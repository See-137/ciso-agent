[project]
name = "ciso"
version = "0.1.0"
description = "Unified CISO Agent: baseline platform (blueprint v1.0)"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.12,<3",
    "sqlalchemy>=2.0.40,<2.1",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "cryptography>=44",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6",
    "httpx>=0.28",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ciso"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers --import-mode=importlib -p no:cacheprovider"
markers = [
    "unit: schema, precedence, freshness, dedupe, state transitions, role checks",
    "connector: connector integration (auth expiry, quotas, retries, replay, gaps)",
    "policy: authorization (deny by default, escalation, wrong role or scope, expiry)",
    "adversarial: prompt injection, poisoned retrieval, tool-output manipulation, memory poisoning",
    "external_inference: disabled default, no fallback, payload binding, egress",
    "broker: tool allowlist, idempotency, rate limit, rollback, verification, kill switch",
    "privacy: tenant boundary, minimisation, access segregation, retention, redaction",
    "resilience: restart, queue recovery, replay, backup and restore, audit integrity",
    "discovery_safety: out-of-scope rejection, safe profiles, throttling, deep-test gate",
]
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF", "PT", "DTZ", "T20"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["ciso"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["ciso"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
