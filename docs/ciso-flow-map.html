<style>

      go.forEach((p,i)=>{ p.held=false; send(p,n); p.t = -i*.06; }); } }
    const q = n.queue.length ? `${K.ui.waiting}: ${n.queue.length}` : K.ui.open; if (n.qt!==q) n.q.textContent = n.qt = q; }

    if (n.flash) { const o = +n.flash.getAttribute('opacity'); if (o>.01) { n.flash.setAttribute('opacity',(o*Math.pow(.15,k)).toFixed(3)); n.flash.setAttribute('r',44+(1-o)*18); } } }
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height); ctx.setTransform(scale*dpr,0,0,scale*dpr,0,0); ctx.globalCompositeOperation = 'lighter';

    ctx.fillStyle=col; ctx.globalAlpha=.28; ctx.beginPath(); ctx.arc(x,y,7,0,7); ctx.fill(); ctx.globalAlpha=1; ctx.beginPath(); ctx.arc(x,y,2.6,0,7); ctx.fill(); }

    const g = ctx.createRadialGradient(x,y,0,x,y,26); g.addColorStop(0,'rgba(255,255,255,.95)'); g.addColorStop(.25,'rgba(255,240,200,.5)'); g.addColorStop(1,'rgba(255,195,92,0)');

<script>
/* ================= SELF-CHECK: needs only a browser. Open this file with #check, or call await livingFlowMap.selfCheck() ================= */
(() => {
'use strict';
const api = window.livingFlowMap; if (!api) return;
const S = api.stats, $ = id => document.getElementById(id), sleep = ms => new Promise(r => setTimeout(r, ms)), sum = o => Object.values(o).reduce((a,b) => a+b, 0);
const until = async (test,ms) => { const end = Date.now()+ms; while (Date.now()<end) { if (test()) return true; await sleep(50); } return false; };
const RTL = /[֐-ࣿיִ-﷿ﹰ-﻿]/, MIN_FPS = 5; // below this the animation is not really running and a verdict would mean nothing
const HIDDEN = 'The animation is not running at a usable speed, usually because this tab is hidden or the browser is not drawing it. Keep the tab in front and reload.';
const liveGates = () => { const todo = id => CONFIG.nodes.find(n => n.id===id).st==='todo'; return CONFIG.nodes.filter(n => n.kind==='gate' && n.st!=='todo' && CONFIG.edges.some(e => e[1]===n.id && e[2]!=='back' && !todo(e[0]))); };

function checkTraffic(check,base){
  const todo = new Set(CONFIG.nodes.filter(n => n.st==='todo').map(n => n.id)), d = (group,id) => (S[group][id]||0)-(base[group][id]||0);
  const liveAux = id => CONFIG.edges.some(e => e[2]==='aux' && e[0]===id && !todo.has(e[1])), fedByFlow = id => CONFIG.edges.some(e => e[1]===id && (e[2]==='flow'||e[2]==='feed'));
  check(S.frames-base.frames>60, 'animation frames ran', `${S.frames-base.frames} frames`);
  const arrivals = sum(S.entered)-sum(base.entered); check(arrivals>20, 'particles reached nodes', `${arrivals} arrivals`);
  for (const n of liveGates()) check(d('releasedBy',n.id)>0, `gate "${n.id}" released queued work`, `${d('releasedBy',n.id)} released`);
  for (const n of CONFIG.nodes) {
    if (n.kind==='sat' && !todo.has(n.id) && liveAux(n.id)) check(d('entered',n.id)>0 && (fedByFlow(n.id) || !d('dead',n.id)), `particles visit and return from side system "${n.id}"`, `${d('entered',n.id)} visited, ${d('dead',n.id)} died there`);
    if (todo.has(n.id)) check(!S.entered[n.id], `no live traffic into not-built node "${n.id}"`, `${S.entered[n.id]||0} arrivals`);
    const visits = d('entered',n.id); // only assert a send-back when missing one could not be chance
    if (n.back && !todo.has(n.id) && !todo.has(n.back) && (1-n.pb)**visits<.001) check(d('sent',n.id)>0, `review "${n.id}" sends work back`, `${d('sent',n.id)} of ${visits} visits`);
  }
}

async function runTour(check,skip,scroller,sc,wide){
  const cap = $('capText'), seen = [], before = S.journeys, maxL = scroller.scrollWidth-scroller.clientWidth, J = CONFIG.journey;
  const X = id => CONFIG.nodes.find(n => n.id===id).x, later = J.slice(1,-1).map((id,i) => Math.max(0,Math.min(maxL,(X(id)+X(J[i+2]))/2*sc-scroller.clientWidth/2)));
  scroller.scrollLeft = 0; api.setSpeed(wide?4:6); $('bJ').click();

  check(await until(() => { if (cap.innerHTML!==first) seen.push(scroller.scrollLeft); return S.journeys>before; },60000), 'follow-one-item tour reached the end');
  const expected = later.length ? Math.max(...later)-Math.min(...later) : 0, moved = seen.length ? Math.max(...seen)-Math.min(...seen) : 0;
  if (wide && expected>80) check(moved>expected*.5, 'phone tour scrolls with the comet', `moved ${Math.round(moved)}px of ${Math.round(expected)}px expected`);
  else if (wide) skip('phone tour scrolls with the comet','this route has no sideways distance to follow');
}

async function checkControls(check,skip){
  const tip = $('tip'), g = document.querySelector('.n'), c = $('fx'), anims = () => document.getAnimations().filter(a => a.playState==='running' && a.animationName).length, before = anims();
  $('bP').click(); api.setSpeed(1); await sleep(300);
  const shot = c.toDataURL(), entered = JSON.stringify(S.entered); await sleep(1200);
  check(c.toDataURL()===shot && JSON.stringify(S.entered)===entered, 'Pause stops particles');
  if (before>0) check(anims()===0, 'Pause stops CSS animation', `${anims()} of ${before} still running`); else skip('Pause stops CSS animation','no CSS animation is running, as with reduced motion');
  $('bP').click();
  if (!document.hasFocus()) { skip('keyboard focus shows and links the details','this frame does not have focus: click into the page and run again'); skip('Escape dismisses the details','needs the same focus'); return; }
  g.focus(); await sleep(250);
  check(tip.classList.contains('show') && tip.textContent.length>0 && getComputedStyle(tip).visibility==='visible' && g.getAttribute('aria-describedby')==='tip', 'keyboard focus shows and links the details');
  document.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape'})); await sleep(50);
  check(!tip.classList.contains('show'), 'Escape dismisses the details');
  g.blur();
}

async function checkTooltips(check,scroller,sc){
  const tip = $('tip'), f = scroller.getBoundingClientRect(), nodes = [...document.querySelectorAll('.n')], bad = [];
  for (const [i,n] of CONFIG.nodes.entries()) {
    scroller.scrollLeft = n.x*sc-scroller.clientWidth+40; // node hard against the right edge of the frame
    nodes[i].dispatchEvent(new MouseEvent('click',{bubbles:true})); await sleep(30);
    const t = tip.getBoundingClientRect(), past = Math.max(Math.round(t.right-f.right),Math.round(f.left-t.left),0);
    if (!tip.classList.contains('show')) bad.push(`${n.id} not shown`); else if (past>0) bad.push(`${n.id} ${past}px`);
    nodes[i].dispatchEvent(new MouseEvent('click',{bubbles:true}));
  }
  check(nodes.length>0 && !bad.length, 'tooltips show and stay inside the frame', `${nodes.length} nodes tried${bad.length?`; bad: ${bad.join(', ')}`:''}`);
}

async function checkPicture(check,skip){
  const c = $('fx'), d = c.getContext('2d').getImageData(0,0,c.width,c.height).data, live = api.live(); let lit = 0; for (let i=3;i<d.length;i+=4) if (d[i]) lit++;
  check(live>0 && lit>live*40, 'canvas shows particles', `${lit} lit pixels for ${live} particles`); // about 40 px each even when they overlap
  const rtl = [...document.querySelectorAll('#front text, #back text')].filter(t => RTL.test(t.textContent)), wrong = rtl.filter(t => getComputedStyle(t).direction!=='rtl').map(t => t.textContent.slice(0,24));
  if (rtl.length) check(!wrong.length, 'right-to-left text has the right direction', wrong.join(' | ')); else skip('right-to-left text has the right direction','this map has no right-to-left text');
}

async function body(check,skip,scroller,sc,wide,base){
  const over = document.documentElement.scrollWidth-innerWidth; check(over<=0, 'page has no sideways scroll', `${over}px`);
  if (wide && scroller.clientWidth===api.openedWidth) check(api.openedAt>0 && api.openedAt<scroller.clientWidth, 'phone opens on the first stage', `first node at ${Math.round(api.openedAt)}px of ${scroller.clientWidth}px`);
  else if (wide) skip('phone opens on the first stage','the width changed since this page loaded: reload at this width to test it');
  if (CONFIG.journey) await runTour(check,skip,scroller,sc,wide);
  api.setSpeed(6); await until(() => liveGates().every(n => (S.releasedBy[n.id]||0)>(base.releasedBy[n.id]||0)),30000); await sleep(4000);
  checkTraffic(check,base);
  const spawned = S.spawned; await sleep(3000); check(S.spawned>spawned, 'new work keeps entering after the map fills', `${S.spawned-spawned} spawned in the last 3 s`);
  await checkPicture(check,skip);
  await checkControls(check,skip);
  await checkTooltips(check,scroller,sc);
  if (location.protocol==='file:') { const ext = performance.getEntriesByType('resource').map(e => e.name).filter(u => !/^(file|data|blob):/.test(u)); check(!ext.length, 'no network requests', ext.slice(0,3).join(' | ')); }
  else skip('no network requests','only measurable when the file is opened directly');
  check(!window.__flowErrors.length, 'no script errors', window.__flowErrors.slice(0,3).join(' | '));
}

async function run(){
  const out = [], check = (ok,name,detail='') => out.push({ok:!!ok,name,detail}), skip = (name,detail) => out.push({ok:true,skipped:true,name,detail});
  const finish = (status,reason='') => ({status:status||(out.some(r => !r.ok)?'fail':'pass'),reason,results:out});
  if (!api.ready && !api.errors.length) { check(false,'engine started',window.__flowErrors[0]||'the engine stopped before it finished starting'); return finish(); }
  check(!api.errors.length, 'CONFIG has no errors', api.errors.join(' | ')); if (api.errors.length) return finish();
  if (document.fonts) await document.fonts.ready;
  api.warnings = api.layout(); check(!api.warnings.length, 'layout has no warnings', api.warnings.join(' | '));
  const t0 = Date.now(), f0 = S.frames; await sleep(700);
  if (document.hidden || S.frames-f0<MIN_FPS*.7) return finish('not-run',HIDDEN);
  let wentHidden = false; const onVis = () => { if (document.hidden) wentHidden = true; }; document.addEventListener('visibilitychange',onVis);
  const scroller = $('scroller'), sc = $('stage').clientWidth/CONFIG.view[0], wide = scroller.scrollWidth>scroller.clientWidth+1, bP = $('bP'), wasPaused = bP.textContent===CONFIG.ui.play;
  const keep = {left:scroller.scrollLeft, x:scrollX, y:scrollY, speed:api.speed(), caption:$('capText').innerHTML}, base = JSON.parse(JSON.stringify(S));
  if (wasPaused) bP.click();
  try { await body(check,skip,scroller,sc,wide,base); }
  catch (err) { check(false,'self-check finished',err.message); }
  finally {
    document.removeEventListener('visibilitychange',onVis); api.setSpeed(keep.speed); scroller.scrollLeft = keep.left; scrollTo(keep.x,keep.y);
    $('capText').innerHTML = keep.caption; $('caption').setAttribute('aria-live','off');
    if ((bP.textContent===CONFIG.ui.play)!==wasPaused) bP.click();

let inFlight = null;
api.selfCheck = () => inFlight || (inFlight = run().finally(() => { inFlight = null; })); // one run at a time: two would fight over Pause and speed

const baseTitle = document.title;
async function showReport(){
  const box = $('selfCheck'); box.hidden = false; box.textContent = 'Running the map self-check, usually about 30 seconds. Keep this tab in front.';
  const r = await api.selfCheck(), ran = r.results.filter(x => !x.skipped), failed = ran.filter(x => !x.ok).length, skipped = r.results.length-ran.length, list = document.createElement('ul');
  const head = document.createElement('strong'); head.textContent = r.status==='not-run' ? `NOT RUN: ${r.reason}` : `${r.status==='pass'?'PASS':'FAIL'}: ${ran.length-failed} of ${ran.length} checks passed${skipped?`, ${skipped} skipped`:''} at ${innerWidth} px wide`;
  for (const x of r.results) { const li = document.createElement('li'); li.textContent = `${x.skipped?'SKIP':x.ok?'PASS':'FAIL'}  ${x.name}${x.detail?`  (${x.detail})`:''}`; if (!x.ok) li.className = 'no'; list.appendChild(li); }
  box.replaceChildren(head,list); document.title = `${r.status.toUpperCase()} - ${baseTitle}`; scrollTo(0,0);
}
if (location.hash==='#check') showReport();
})();
